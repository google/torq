[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "google-torq"
version = "0.1.0"
description = "Android & AAOS Performance Profiling CLI Tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "The Android Open Source Project"}
]
keywords = ["android", "aaos", "performance", "perfetto", "simpleperf", "profiling", "tracing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "yapf==0.40.2",
    "perfetto==0.16.0",
    "pandas>=2.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
torq = "torq.torq:run"

[project.urls]
Homepage = "https://github.com/google/torq"
Documentation = "https://github.com/google/torq/blob/main/README.md"
Repository = "https://github.com/google/torq.git"
Issues = "https://github.com/google/torq/issues"

[tool.setuptools]
packages = ["torq"]

[tool.setuptools.package-dir]
torq = "src"
